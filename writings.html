<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Writings - Ahilan Karuppusami</title>
    <meta name="description" content="Essays by Ahilan Karuppusami." />
    <link rel="canonical" href="https://ahilanks.github.io/writings.html" />

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --text-color: #27323f;
        --link-color: #0f7ae5;
        --bg-color: #f1ebdf;
        --muted: #6b7280;
      }

      body {
        margin: 0;
        padding: 0 1.5rem;
        font-family: "Inter", sans-serif;
        color: var(--text-color);
        background-color: var(--bg-color);
        line-height: 1.6;
      }

      .container {
        max-width: 760px;
        margin: 6rem auto;
      }

      h1 {
        text-align: center;
        font-size: 2.5rem;
        font-weight: 700;
        line-height: 1.8;
        margin: 0;
      }

      .description {
        text-align: center;
        font-style: italic;
        font-size: 0.92rem;
        margin-top: -0.35rem;
        margin-bottom: 2.25rem;
        color: var(--muted);
      }

      .why-write {
        max-width: 34rem;
        margin: 0 0 2.25rem;
      }
      .why-write summary {
        width: fit-content;
        font-size: 0.85rem;
        color: var(--muted);
        cursor: pointer;
        list-style: none;
      }
      .why-write summary::-webkit-details-marker {
        display: none;
      }
      .why-write summary::after {
        content: "›";
        display: inline-block;
        margin-left: 0.4em;
        transition: transform 0.15s ease;
      }
      .why-write[open] summary::after {
        transform: rotate(90deg);
      }
      .why-write summary:hover {
        color: var(--text-color);
      }
      .why-write figure {
        margin: 1.25rem 0 0;
      }
      .why-write blockquote {
        margin: 0;
        font-size: 0.84rem;
        line-height: 1.7;
      }
      .why-write blockquote p {
        margin: 0 0 0.9em;
      }
      .why-write figcaption {
        font-size: 0.8rem;
        color: var(--muted);
      }
      .why-write a {
        color: inherit;
        text-underline-offset: 2px;
      }

      /* ---------- Post list (Substack-style: neat spacing, no dividers) ---------- */
      .post-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .post {
        display: flex;
        gap: 1.5rem;
        align-items: flex-start;
        margin-bottom: 2.6rem;
      }

      .post-thumb {
        flex: 0 0 auto;
        width: 168px;
        height: 90px;
        border-radius: 10px;
        overflow: hidden;
        display: block;
        background: linear-gradient(135deg, #e7ddca 0%, #f1ebdf 100%);
      }
      .post-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      /* No image set (or it failed to load) -> hide the box; title goes full width */
      .post-thumb:empty,
      .post-thumb.no-img {
        display: none;
      }

      .post-info {
        flex: 1;
        min-width: 0;
      }

      .post-title {
        display: block;
        font-size: 1rem;
        font-weight: 500;
        line-height: 1.3;
        letter-spacing: -0.005em;
        color: var(--text-color);
        text-decoration: none;
      }
      .post-title:hover {
        text-decoration: underline;
        text-decoration-skip-ink: none;
      }

      .post-meta {
        margin: 0.4rem 0 0;
        color: var(--muted);
        font-size: 0.85rem;
      }

      @media (max-width: 560px) {
        .post-thumb { width: 120px; height: 64px; }
        .post-title { font-size: 1rem; }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <h1>Writings</h1>
      <p class="description">a discretized version of my [latent] thoughts</p>

      <details class="why-write">
        <summary>Why write?</summary>
        <figure>
          <blockquote>
            <p>
              “To understand what a real essay is, we have to reach back into
              history again, though this time not so far. To Michel de Montaigne,
              who in 1580 published a book of what he called ‘essais.’ He was
              doing something quite different from what lawyers do, and the
              difference is embodied in the name. Essayer is the French verb
              meaning ‘to try’ and an essai is an attempt. An essay is something
              you write to try to figure something out.
            </p>
            <p>
              Figure out what? You don’t know yet. And so you can’t begin with a
              thesis, because you don’t have one, and may never have one. An essay
              doesn’t begin with a statement, but with a question. In a real
              essay, you don’t take a position and defend it. You notice a door
              that’s ajar, and you open it and walk in to see what’s inside.
            </p>
            <p>
              If all you want to do is figure things out, why do you need to write
              anything, though? Why not just sit and think? Well, there precisely
              is Montaigne’s great discovery. Expressing ideas helps to form them.
              Indeed, helps is far too weak a word. Most of what ends up in my
              essays I only thought of when I sat down to write them. That’s why I
              write them.”
            </p>
          </blockquote>
          <figcaption>
            Paul Graham,
            <a href="https://paulgraham.com/essay.html" target="_blank" rel="noopener"
              >The Age of the Essay</a
            >
          </figcaption>
        </figure>
      </details>

      <!--
        To add a thumbnail to a post, drop an image in media/ and put an <img> inside
        .post-thumb:  <a class="post-thumb" href="…"><img src="media/my-thumb.jpg" alt="" /></a>
        Leave .post-thumb empty for a clean text-only row.
      -->
      <ul class="post-list">
        <li class="post" id="post-why-ai-is-eating-software">
          <a
            class="post-thumb"
            href="https://ahilanks.substack.com/p/why-ai-is-eating-software"
            target="_blank"
            rel="noopener"
            ><img
              src="media/typewriter.jpg"
              alt=""
              onerror="this.parentNode.classList.add('no-img');this.remove();"
          /></a>
          <div class="post-info">
            <a
              class="post-title"
              href="https://ahilanks.substack.com/p/why-ai-is-eating-software"
              target="_blank"
              rel="noopener"
              >Why AI is Eating Software</a
            >
            <p class="post-meta">Feb 6, 26 · 4 min</p>
          </div>
        </li>

        <li class="post" id="post-information-consumption">
          <a
            class="post-thumb"
            href="https://ahilanks.substack.com/p/finding-good-donuts"
            target="_blank"
            rel="noopener"
            ><img
              src="media/donuts.jpg"
              alt=""
              onerror="this.parentNode.classList.add('no-img');this.remove();"
          /></a>
          <div class="post-info">
            <a
              class="post-title"
              href="https://ahilanks.substack.com/p/finding-good-donuts"
              target="_blank"
              rel="noopener"
              >Information Consumption</a
            >
            <p class="post-meta">Aug 9, 25 · 3 min</p>
          </div>
        </li>
      </ul>
    </main>
  </body>
</html>
