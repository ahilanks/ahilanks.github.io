<style>
  html, body { margin: 0; background: transparent; }
  body {
    font-family: var(--font, "Newsreader", Georgia, "Times New Roman", serif);
    color: var(--ink, #27323f);
  }
  .wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { border-collapse: collapse; width: 100%; min-width: 680px; }
  th, td { padding: 0; }

  /* group header: what drives the response */
  th.group {
    font-weight: 400; font-style: italic; font-size: 14px;
    color: var(--muted, #6b7280); text-align: center;
    padding: 0 4px 6px; border-bottom: 1px solid var(--muted, #6b7280);
  }
  th.group.q { color: var(--accent, #e8743b); border-bottom-color: var(--accent, #e8743b); }

  /* column subheader: the responses */
  th.col {
    font-weight: 400; font-size: 13px; line-height: 1.2;
    vertical-align: bottom; text-align: center;
    padding: 10px 3px 8px; width: 7.6%;
  }
  th.col.q { color: var(--accent, #e8743b); }

  td {
    border-top: 1px solid var(--line, rgba(39,50,63,0.15));
    text-align: center; vertical-align: middle; height: 44px;
  }
  td.has { cursor: default; }
  .name, th.corner {
    position: sticky; left: 0; z-index: 1;
    background: #f1ebdf; text-align: left; width: 150px; min-width: 130px;
  }
  .gstart { border-left: 1px solid var(--line, rgba(39,50,63,0.15)); }
  .qcol { border-left: 1px dashed var(--accent, #e8743b); }

  .row-toggle {
    all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    font-family: inherit; font-size: 16px; color: var(--ink, #27323f); padding: 4px 0;
  }
  .row-toggle:focus-visible { outline: 1.5px solid var(--ink, #27323f); outline-offset: 3px; }
  .chev {
    width: 6px; height: 6px; flex: none;
    border-right: 1.2px solid var(--muted, #6b7280); border-bottom: 1.2px solid var(--muted, #6b7280);
    transform: rotate(-45deg); transition: transform .15s;
  }
  .row-toggle[aria-expanded="true"] .chev { transform: rotate(45deg); }
  .count { font-size: 12px; color: var(--muted, #6b7280); }

  tr.sub td { height: 34px; }
  tr.sub td.name { padding-left: 22px; font-size: 13px; color: var(--muted, #6b7280); }
  tr.sub[hidden] { display: none; }

  tr.ai td { border-top: 1px dashed var(--muted, #6b7280); }
  .plain { font-size: 16px; padding-left: 14px; display: block; line-height: 1.15; }

<div class="wrap" id="wrap">
  <table>
    <thead>
      <tr>
        <th class="corner"></th>
        <th class="group" colspan="5">Present interest</th>
        <th class="group gstart" colspan="2">Memory</th>
        <th class="group gstart" colspan="3">Principle</th>
        <th class="group q qcol">Unknown</th>
      </tr>
      <tr id="colhead"><th class="corner"></th></tr>
    </thead>
    <tbody id="body"></tbody>
  </table>
</div>
<div class="tip" id="tip" role="tooltip" hidden></div>

<script>
const COLS = [
  { k: "Kill", g: 0 }, { k: "Exile or exit", g: 0 }, { k: "Use as labor", g: 0 }, { k: "Tolerate", g: 0 }, { k: "Absorb", g: 0 },
  { k: "Punish past rule", g: 1 }, { k: "Reconcile", g: 1 },
  { k: "Judge by rules", g: 2 }, { k: "Preserve", g: 2 }, { k: "Extend care", g: 2 },
  { k: "Beyond us", g: 3 }
];

const LEVELS = [
  { name: "Microbes", species: [
    { name: "Bacteria", c: { 0: "Type VI secretion needles stab and kill rival bacteria to free up space", 3: "In Lenski's experiment the old E. coli strain coexisted on a different resource for 10,000+ generations, then went extinct" } }
  ]},
  { name: "Social insects", species: [
    { name: "Honeybees", c: { 0: "New queens sting rival queens to death, even unhatched ones", 1: "The old queen leaves with a swarm before the new queen emerges", 3: "If an old queen and a new one share a swarm, the old queen is usually allowed to live" } },
    { name: "Ants", c: { 0: "A parasitic queen invades and kills the host queen", 2: "Host workers raise the invader's brood until they die out" } },
    { name: "Paper wasps", c: { 0: "Usurpers destroy the youngest brood", 1: "Usurpers drive off the original foundress", 2: "Usurpers take over the resident workforce" } }
  ]},
  { name: "Fish", species: [
    { name: "Cichlids", c: { 3: "Males that lose rank fade in color and turn subordinate" } },
    { name: "Clownfish", c: { 3: "Succession by queue: when the female dies, the next in line takes her place" } }
  ]},
  { name: "Mammals", species: [
    { name: "Lions", c: { 0: "A new coalition kills the cubs so females breed again sooner", 1: "The old males are chased off" } },
    { name: "Meerkats", c: { 0: "The dominant female kills rivals' pups", 1: "Rival females are evicted from the group", 2: "Mothers who lost pups often wet-nurse the dominant's litter" } },
    { name: "Wolves", c: { 0: "Old dominant males are sometimes killed, though rarely in the wild", 1: "An ousted breeder may be exiled", 3: "An ousted breeder may be kept in a subordinate role", 4: "New males usually adopt the previous male's pups" } },
    { name: "Gorillas", c: { 0: "A new silverback will most likely kill unweaned infants", 3: "In mountain gorilla groups, a subordinate male inherits the group" } },
    { name: "Elephants", c: { 3: "The next oldest female leads; older matriarchs are valued for what they know" } }
  ]},
  { name: "Primates", species: [
    { name: "Macaques", c: { 0: "Overthrows of whole family lines cause injury and death" } },
    { name: "Chimpanzees", c: { 0: "A coalition killed a former alpha when he tried to return", 1: "A deposed alpha lived alone on the edge of the community for years", 3: "Deposed males can stay on at a lower rank", 5: "Two of the four attackers in one alpha killing were former alphas", 6: "Former opponents kiss and embrace after fights" } },
    { name: "Bonobos", c: { 3: "Males are tolerated within female-led groups", 5: "Female coalitions attack males who were aggressive" } }
  ]},
  { name: "Humans", species: [
    { name: "Ancient", c: { 0: "43 of 69 Roman emperors (62%) died violently", 1: "Rivals and deposed rulers sent into exile", 2: "Conquered peoples enslaved", 3: "Client kings left in place", 4: "Conquered peoples granted citizenship", 5: "Purges, and erasing a fallen ruler's memory" } },
    { name: "Modern", c: { 0: "Some deposed leaders are still executed", 1: "Ousted leaders flee or are sent into exile", 3: "Pardons and peaceful transfers of power", 4: "Assimilation and integration", 5: "Purges and lustration laws", 6: "Truth and reconciliation commissions", 7: "Trials under law", 8: "Museums, archives, seed and gene banks", 9: "Rights, conservation, animal welfare" } }
  ]},
  { name: "Smarter AI", ai: true }
];

const AI_TEXT = "Projected: likely within reach. Which it uses depends more on memory and principle than on present interest.";
const Q_TEXT = "Responses no animal or human has had, which we can't picture, the way a bacterium can't conceive of a trial.";

/* ---------- tooltip ---------- */
const tip = document.getElementById("tip");
let active = null, pinned = false, lastTouch = 0;

function fill(d) {
  tip.innerHTML = "";
  const h = document.createElement("div");
  h.className = "h" + (d.q ? " q" : "");
  h.textContent = d.title;
  tip.appendChild(h);
  if (d.items.length === 1 && !d.items[0].who) {
    const p = document.createElement("p");
    p.textContent = d.items[0].text;
    tip.appendChild(p);
  } else {
    const ul = document.createElement("ul");
    d.items.forEach(it => {
      const li = document.createElement("li");
      if (it.who) { const b = document.createElement("b"); b.textContent = it.who + ": "; li.appendChild(b); }

      ul.appendChild(li);
    });
    tip.appendChild(ul);
  }

function place(el) {
  const r = el.getBoundingClientRect();
  const W = window.innerWidth, H = window.innerHeight;
  tip.style.maxWidth = Math.min(270, W - 16) + "px";
  tip.style.left = "0px"; tip.style.top = "0px";
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let left = r.left + r.width / 2 - tw / 2;
  left = Math.max(8, Math.min(left, W - tw - 8));
  const below = H - r.bottom, above = r.top;
  let top = (below >= th + 10 || below >= above) ? r.bottom + 8 : r.top - th - 8;

  tip.style.top = top + "px";

  if (active && active !== el) active.classList.remove("on");

  tip.hidden = false;

}

const colhead = document.getElementById("colhead");
COLS.forEach((c, i) => {
  const th = document.createElement("th");
  th.className = "col " + cellClass(i) + (c.g === 3 ? " q" : "");
  th.scope = "col";
  th.textContent = c.k;
  colhead.appendChild(th);

function dot(cls, title, items, q) {
  const s = document.createElement("span");
  s.className = "dot " + cls;
  s.tabIndex = 0;
  s.setAttribute("aria-label", title + ". " + items.map(it => (it.who ? it.who + ": " : "") + it.text).join(". "));

}

  const td = document.createElement("td");
  td.className = cellClass(i);
  if (child) {
    td.classList.add("has");
    td._dot = child;
    td.appendChild(child);
  } else {
    const e = document.createElement("span");
    e.className = "empty";
    e.setAttribute("aria-hidden", "true");
    td.appendChild(e);
  }
  return td;
}

const body = document.getElementById("body");
LEVELS.forEach(level => {
  const tr = document.createElement("tr");
  const nameTd = document.createElement("td");
  nameTd.className = "name";
  const subRows = [];

  if (level.ai) {
    tr.className = "ai";
    nameTd.innerHTML = '<span class="plain">Smarter AI<small>projected</small></span>';
  } else {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "row-toggle";
    btn.setAttribute("aria-expanded", "false");
    btn.innerHTML = '<span class="chev" aria-hidden="true"></span>';
    const label = document.createElement("span");
    label.textContent = level.name;
    btn.appendChild(label);
    if (level.species.length > 1) {
      const n = document.createElement("span");
      n.className = "count";
      n.textContent = level.species.length;
      btn.appendChild(n);
    }
    btn.addEventListener("click", () => {
      const open = btn.getAttribute("aria-expanded") !== "true";
      btn.setAttribute("aria-expanded", String(open));
      subRows.forEach(r => { r.hidden = !open; });
      hide();
    });
    nameTd.appendChild(btn);
  }
  tr.appendChild(nameTd);

  COLS.forEach((c, i) => {
    if (level.ai) {
      const q = i === 10;
      tr.appendChild(cell(i, dot(q ? "unk" : "ext", "Smarter AI · " + c.k, [{ text: q ? Q_TEXT : AI_TEXT }], true)));
      return;
    }
    const items = level.species.filter(s => s.c[i]).map(s => ({ who: s.name, text: s.c[i] }));
    tr.appendChild(cell(i, items.length ? dot("", level.name + " · " + c.k, items, false) : null));
  });
  body.appendChild(tr);

  if (level.ai) return;
  level.species.forEach(sp => {
    const sr = document.createElement("tr");
    sr.className = "sub";
    sr.hidden = true;
    const n = document.createElement("td");
    n.className = "name";
    n.textContent = sp.name;
    sr.appendChild(n);
    COLS.forEach((c, i) => sr.appendChild(cell(i, sp.c[i] ? dot("sm", sp.name + " · " + c.k, [{ text: sp.c[i] }], false) : null)));
    body.appendChild(sr);
    subRows.push(sr);
  });
});

/* hover: one listener on the table body, follows the mouse cell to cell */
body.addEventListener("mouseover", e => {
  if (fromTouch()) return;
  const td = e.target.closest("td.has");
  if (td) show(td._dot); else hide();
});
body.addEventListener("mouseleave", () => { if (!fromTouch()) hide(); });

/* touch has no hover, so a tap opens it instead */
document.addEventListener("touchstart", () => { lastTouch = Date.now(); }, { passive: true, capture: true });
body.addEventListener("click", e => {
  if (!fromTouch()) return;
  const td = e.target.closest("td.has");
  if (!td) return;
  e.stopPropagation();
  if (active === td._dot && pinned) { hide(); return; }
  show(td._dot); pinned = true;
});

document.addEventListener("click", e => { if (fromTouch() && !e.target.closest("td.has")) hide(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") hide(); });
document.getElementById("wrap").addEventListener("scroll", hide, { passive: true });
window.addEventListener("scroll", hide, { passive: true });
window.addEventListener("resize", () => { if (active && !tip.hidden) place(active); });
</script>
