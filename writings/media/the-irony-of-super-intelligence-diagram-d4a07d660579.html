<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --ink: #27323f; --muted: #6b7280; --accent: #e8743b;
    --line: rgba(39,50,63,0.15);
    --tint-green: #e6f2e6; --tint-red: #f8e4df; --tint-orange: #fbe3d4;
    --font: "Newsreader", Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: var(--font); color: var(--ink); }
  .fig { width: 100%; max-width: 560px; margin: 0 auto; padding: 8px 4px 0; box-sizing: border-box; }

  .controls { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; margin-bottom: 18px; }
  .controls button {
    font-family: var(--font); font-size: 14px; color: var(--ink);
    background: transparent; border: 1px solid var(--line); border-radius: 999px;
    padding: 4px 12px; cursor: pointer; line-height: 1.3;
  }
  .controls button[aria-pressed="true"] { border-color: var(--ink); }
  .controls button:focus-visible { outline: 1.5px solid var(--accent); outline-offset: 2px; }
  .controls .step { color: var(--muted); font-size: 14px; }

  .matrix {
    display: grid; grid-template-columns: auto 1fr 1fr;
    align-items: stretch;
  }
  .colhead, .rowhead { font-size: 15px; color: var(--muted); }
  .colhead { text-align: center; padding: 0 4px 8px; }
  .rowhead { display: flex; align-items: center; justify-content: flex-end; padding-right: 12px; white-space: nowrap; }
  .who { color: var(--ink); }
  .cell {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 72px; font-size: 17px; white-space: nowrap;
    border-top: 1px solid var(--line); border-left: 1px solid var(--line);
    transition: background-color 0.35s ease, color 0.35s ease;
  }
  .cell.c2 { border-right: 1px solid var(--line); }
  .cell.r2 { border-bottom: 1px solid var(--line); }
  .cell .a { color: var(--ink); }
  .cell .b { color: var(--muted); }
  .cell.eq { background: var(--tint-orange); }
  .cell.eq .a, .cell.eq .b { color: var(--accent); }

  /* The outcome the reader should watch: (restrain, restrain) */
  .cell.goal { outline: 1.5px dashed var(--accent); outline-offset: -6px; }
  .cell.goal.eq { outline-style: solid; }
  .tag { font-size: 13px; color: var(--accent); margin-top: 3px; }

  .verdict { text-align: center; font-size: 17px; color: var(--ink); margin: 16px 8px 0; transition: color 0.35s ease; }
  .verdict.open { color: var(--accent); }

  /* All three explanations share one grid cell, so the block is exactly as tall
     as the longest one: no jumping between states, no reserved empty lines. */
  .outcome { display: grid; text-align: center; font-size: 15px; color: var(--muted); margin: 6px 8px 0; line-height: 1.35; }
  .outcome span { grid-area: 1 / 1; visibility: hidden; }
  .outcome span.on { visibility: visible; }

  @media (max-width: 420px) {
    .cell { font-size: 15px; min-height: 62px; }
    .colhead, .rowhead { font-size: 13px; }
    .rowhead { padding-right: 8px; }
    .verdict { font-size: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { .cell, .verdict { transition: none; } }
</style>
</head>
<body>
<div class="fig">
  <div class="controls" role="group" aria-label="Who believes building is destructive">
    <button data-s="0" aria-pressed="true">Neither convinced</button>
    <span class="step" aria-hidden="true">→</span>
    <button data-s="1" aria-pressed="false">Only A convinced</button>
    <span class="step" aria-hidden="true">→</span>
    <button data-s="2" aria-pressed="false">Both convinced</button>
  </div>

  <div class="matrix" aria-live="polite">
    <div></div>
    <div class="colhead"><span class="who">B</span> restrains</div>
    <div class="colhead"><span class="who">B</span> builds</div>

    <div class="rowhead"><span class="who">A</span>&nbsp;restrains</div>
    <div class="cell goal" id="rr"></div>
    <div class="cell c2" id="rb"></div>

    <div class="rowhead"><span class="who">A</span>&nbsp;builds</div>
    <div class="cell r2" id="br"></div>
    <div class="cell c2 r2" id="bb"></div>
  </div>

  <div class="verdict" id="verdict"></div>
  <div class="outcome" id="outcome" aria-live="polite"></div>
</div>

<script>
(function () {
  var NEG_INF = "\u2212\u221E";

  // Believed payoff for a player.
  // Convinced: any building is -inf for everyone.
  // Unconvinced: build alone = win, restrain alone = lose, both build = race.
  function pay(me, other, convinced) {
    if (me === "R" && other === "R") return "0";
    if (convinced) return NEG_INF;
    if (me === "B" && other === "R") return "win";
    if (me === "R" && other === "B") return "lose";
    return "race";
  }

  var states = [
    { a: false, b: false, eq: ["bb"], open: false,
      verdict: "Mutual restraint: out of reach",
      text: "Whatever the other side does, building looks better, so both build." },
    { a: true, b: false, eq: ["rb", "bb"], open: false,
      verdict: "Mutual restraint: still out of reach",
      text: "B still finds building better whatever A does. A gets \u2212\u221E either way." },
    { a: true, b: true, eq: ["rr", "bb"], open: true,
      verdict: "Mutual restraint: possible, not guaranteed",
      text: "Restraint is now stable, but so is building. Restraint holds only if each side can check the other." }
  ];

  var cells = { rr: ["R","R"], rb: ["R","B"], br: ["B","R"], bb: ["B","B"] };
  var buttons = document.querySelectorAll(".controls button");
  var outcome = document.getElementById("outcome");
  var verdict = document.getElementById("verdict");

  var lines = states.map(function (s) {
    var sp = document.createElement("span");
    sp.textContent = s.text;
    outcome.appendChild(sp);
    return sp;
  });

  function render(i) {
    var s = states[i];
    Object.keys(cells).forEach(function (id) {
      var a = cells[id][0], b = cells[id][1];
      var el = document.getElementById(id);
      var html = '<span><span class="a">(' + pay(a, b, s.a) + '</span>,&nbsp;<span class="b">' + pay(b, a, s.b) + ')</span></span>';
      if (id === "rr") html += '<span class="tag">mutual restraint</span>';
      el.innerHTML = html;
      el.classList.toggle("eq", s.eq.indexOf(id) !== -1);
    });
    verdict.textContent = s.verdict;
    verdict.classList.toggle("open", s.open);
    lines.forEach(function (sp, k) { sp.classList.toggle("on", k === i); });
    buttons.forEach(function (btn) {
      btn.setAttribute("aria-pressed", btn.getAttribute("data-s") === String(i) ? "true" : "false");
    });
  }

  buttons.forEach(function (btn) {
    btn.addEventListener("click", function () { render(+btn.getAttribute("data-s")); });
  });
  render(0);
})();
</script>
